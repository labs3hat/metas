name: Planilhas gerenciais — corrigir no Drive

# Só por disparo manual. Baixa as "Gestao Financeira <loja> 2026.xlsm" da pasta,
# aplica as correções de gerenciais/corrige_planilha.py e, se "simular" for
# false, sobe cada uma como nova versão do MESMO arquivo (a anterior fica em
# Gerenciar versões, marcada para não ser apagada).
on:
  workflow_dispatch:
    inputs:
      lojas:
        description: '"todas" ou lista: sjp1,ctba3,ctba5,cl2,ctba7,ctba11,mga3,mga5,mga7,mga8'
        required: false
        default: "todas"
      simular:
        description: "true = só mostra o que mudaria; false = grava no Drive"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      receita_lojas:
        description: 'Lojas que recebem a receita do BIP360 na linha 101 da DRE: "" (nenhuma), "todas" ou lista'
        required: false
        default: ""
      receita_meses:
        description: 'Meses da receita: "1-9" ou "7,8,9"'
        required: false
        default: "1-9"

concurrency:
  group: gerenciais-drive
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-auth==2.29.0 gspread==6.1.2 openpyxl==3.1.5 requests==2.31.0

      - name: Corrigir planilhas
        working-directory: gerenciais
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GERENCIAIS_PASTA_ID: 1_cR2OJXzRgtle5JIIE4gWBPPWbUSTVtU
          LOJAS: ${{ inputs.lojas }}
          SIMULAR: ${{ inputs.simular }}
          RECEITA_LOJAS: ${{ inputs.receita_lojas }}
          RECEITA_MESES: ${{ inputs.receita_meses }}
        run: python corrigir_lote.py
