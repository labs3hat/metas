name: BIP360 Daily Scraper

on:
  schedule:
    # 03:07 BRT = 06:07 UTC. Minuto quebrado de propósito: o GitHub atrasa os
    # agendamentos da virada da hora (em out/2026, 5 a 6 horas).
    - cron: "7 6 * * *"
  workflow_dispatch:

# Uma execução por vez: o watchdog pode disparar enquanto o agendamento
# atrasado também começa. A segunda espera a primeira (mesmo usuário no BIP360).
concurrency:
  group: bip360-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar scraper
        env:
          BIP_USER: ${{ secrets.BIP_USER }}
          BIP_PASS: ${{ secrets.BIP_PASS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # Escrita dupla no banco do sistema novo (banco_coleta.py). Sem o
          # secret, fica vazio e o scraper grava só na planilha.
          COLETA_TOKEN: ${{ secrets.COLETA_TOKEN }}
          DEBUG_DIR: debug
        run: python scraper.py

      - name: Salvar prints de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bip360-debug
          path: debug/
          if-no-files-found: ignore

      - name: Notificar em caso de falha
        if: failure()
        run: |
          echo "::warning::O scraper falhou. Verifique os logs acima e baixe o artifact bip360-debug."
