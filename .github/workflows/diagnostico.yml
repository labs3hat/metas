name: Diagnóstico do ranking (só leitura)

# Temporário: roda diagnostico_ranking.py quando a branch de trabalho recebe
# push. Não grava planilha nem banco. Sai junto com o script depois do achado.
on:
  push:
    branches: [claude/funny-archimedes-v3vh3p]
    paths: [diagnostico_ranking.py, .github/workflows/diagnostico.yml]

jobs:
  diagnostico:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Rodar diagnóstico
        env:
          BIP_USER: ${{ secrets.BIP_USER }}
          BIP_PASS: ${{ secrets.BIP_PASS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DEBUG_DIR: debug
        run: python diagnostico_ranking.py
