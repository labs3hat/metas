name: Resumo Distribuições — corrigir no Drive

# Disparo manual. Baixa o "Resumo Distribuições Lucros" da pasta das gerenciais, aplica
# gerenciais/corrige_distribuicoes.py e, se "simular" for false, sobe como nova versão do
# MESMO arquivo (a anterior fica em Gerenciar versões, marcada para não ser apagada).
on:
  workflow_dispatch:
    inputs:
      simular:
        description: "true = só mostra o que mudaria; false = grava no Drive"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      arquivo:
        description: "Nome exato do arquivo na pasta"
        required: false
        default: "2026.09 - Resumo Distribuições Lucros.xlsx"

concurrency:
  group: gerenciais-drive
  cancel-in-progress: false

jobs:
  corrigir:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-auth==2.29.0 openpyxl==3.1.5 requests==2.31.0
      - name: Corrigir planilha
        working-directory: gerenciais
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GERENCIAIS_PASTA_ID: 1_cR2OJXzRgtle5JIIE4gWBPPWbUSTVtU
          DISTRIBUICOES_NOME: ${{ inputs.arquivo }}
          SIMULAR: ${{ inputs.simular }}
        run: python corrigir_distribuicoes.py
