name: Watchdog — Re-run on Failure

# Confere os DOIS coletores (Indicadores e Daily) a cada execução e dispara de
# novo quem não terminou com sucesso hoje. Duas execuções por dia, em minutos
# quebrados, para ter uma segunda chance.
#
# Até 04/10/2026 o watchdog deduzia pela hora UTC qual coletor conferir ("08"
# = indicadores). Com o GitHub atrasando os agendamentos em 5 a 6 horas, ele
# nunca rodava às 08: conferia o Daily duas vezes e nunca os Indicadores.
#
# Coletor rodando ou na fila não é falha: não dispara outro em cima.
#
# Pré-requisito: secret GH_TOKEN com permissão actions:write
#   → GitHub → Settings → Secrets → Actions → New repository secret
#   → Nome: GH_TOKEN
#   → Valor: Personal Access Token com scope "repo" (fine-grained: Actions=write)

on:
  schedule:
    - cron: "37 8 * * *"    # 05:37 BRT
    - cron: "37 10 * * *"   # 07:37 BRT — segunda chance
  workflow_dispatch:
    inputs:
      target:
        description: "Workflow a verificar manualmente (daily, indicadores ou ambos)"
        required: true
        default: "ambos"
        type: choice
        options:
          - ambos
          - daily
          - indicadores

jobs:
  watchdog:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Conferir e disparar de novo quem falhou
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_TARGET" != "ambos" ]; then
            TARGETS="$MANUAL_TARGET"
          else
            TARGETS="indicadores daily"
          fi

          FALHAS=0
          for TARGET in $TARGETS; do
            if [ "$TARGET" = "indicadores" ]; then
              FILENAME=indicadores_daily.yml; LABEL="BIP360 Indicadores Diários"
            else
              FILENAME=daily.yml; LABEL="BIP360 Daily Scraper"
            fi

            RESPONSE=$(curl -sS --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?per_page=5")

            # Situação de hoje: "rodando" se algum run de hoje está na fila ou
            # rodando; "ok" se algum terminou com sucesso hoje; senão "falhou".
            SITUACAO=$(echo "$RESPONSE" | TODAY="$TODAY" python3 -c "
          import json, os, sys
          hoje = os.environ['TODAY']
          runs = [r for r in json.load(sys.stdin).get('workflow_runs', [])
                  if r.get('created_at', '')[:10] == hoje]
          if any(r.get('status') in ('queued', 'in_progress', 'waiting', 'requested', 'pending') for r in runs):
              print('rodando')
          elif any(r.get('conclusion') == 'success' for r in runs):
              print('ok')
          else:
              print('falhou')
          ")
            echo "$LABEL ($FILENAME) em $TODAY: $SITUACAO"

            if [ "$SITUACAO" = "falhou" ]; then
              echo "ALERTA — $LABEL não terminou com sucesso hoje. Disparando de novo."
              HTTP_STATUS=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/dispatches" \
                -d '{"ref":"main"}')
              if [ "$HTTP_STATUS" = "204" ]; then
                echo "Re-run de $FILENAME disparado (HTTP 204)."
              else
                echo "::error::Falha ao disparar $FILENAME. HTTP status: $HTTP_STATUS"
                FALHAS=$((FALHAS + 1))
              fi
            fi
          done

          exit $FALHAS
