name: BIP360 Indicadores Diários

on:
  schedule:
    # 02:13 BRT = 05:13 UTC. Minuto quebrado de propósito: o GitHub atrasa os
    # agendamentos da virada da hora (em out/2026, 5 a 6 horas).
    - cron: "13 5 * * *"
  workflow_dispatch:

# Uma execução por vez: o watchdog pode disparar enquanto o agendamento
# atrasado também começa. A segunda espera a primeira (mesmo usuário no BIP360).
concurrency:
  group: bip360-indicadores
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar scraper de indicadores
        env:
          BIP_USER: ${{ secrets.BIP_USER }}
          BIP_PASS: ${{ secrets.BIP_PASS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # Escrita dupla no banco do sistema novo (banco_coleta.py). Sem o
          # secret, fica vazio e o scraper grava só na planilha.
          COLETA_TOKEN: ${{ secrets.COLETA_TOKEN }}
          DEBUG_DIR: debug
        run: python indicadores_scraper.py

      - name: Salvar prints de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicadores-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Notificar em caso de falha
        if: failure()
        run: |
          echo "::error::O scraper de indicadores falhou. Baixe o artifact 'indicadores-debug-${{ github.run_id }}' para diagnóstico."
