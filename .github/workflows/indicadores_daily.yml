name: BIP360 Indicadores Diários

on:
  schedule:
    # 02:13 BRT = 05:13 UTC. Minuto quebrado de propósito: o GitHub atrasa os
    # agendamentos da virada da hora (em out/2026, 5 a 6 horas).
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      recoletar:
        description: >-
          Recoleta pontual: "dd/mm/aaaa[:loja,loja];dd/mm/aaaa" (sem loja = todas;
          lojas: sjp1 ctba3 ctba5 cl2 ctba7 ctba9 ctba11 mga3 mga5 mga7).
          Só sobrescreve quando a receita nova for maior que a gravada.
        required: false
        default: ""
      reconferir_dias:
        description: "Dias recentes recoletados mesmo preenchidos (padrão 3)."
        required: false
        default: "3"

# Uma execução por vez: o watchdog pode disparar enquanto o agendamento
# atrasado também começa. A segunda espera a primeira (mesmo usuário no BIP360).
concurrency:
  group: bip360-indicadores
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar scraper de indicadores
        env:
          BIP_USER: ${{ secrets.BIP_USER }}
          BIP_PASS: ${{ secrets.BIP_PASS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          # Escrita dupla no banco do sistema novo (banco_coleta.py). Sem o
          # secret, fica vazio e o scraper grava só na planilha.
          COLETA_TOKEN: ${{ secrets.COLETA_TOKEN }}
          DEBUG_DIR: debug
          # Reconferência dos dias recentes e recoleta pontual (ver RECONFERIR_DIAS
          # e RECOLETAR no scraper). No agendamento, os inputs vêm vazios → padrão.
          RECONFERIR_DIAS: ${{ inputs.reconferir_dias || '3' }}
          RECOLETAR: ${{ inputs.recoletar || '' }}
        run: python indicadores_scraper.py

      - name: Salvar prints de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indicadores-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Notificar em caso de falha
        if: failure()
        run: |
          echo "::error::O scraper de indicadores falhou. Baixe o artifact 'indicadores-debug-${{ github.run_id }}' para diagnóstico."
